<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ストップウォッチ</title>


</head>
<style>
    body {
        text-align: center;
        background-color: lightblue;
    }

    h1 {
        margin-top: 50px;
    }

    #time {
        font-size: 60px;
    }

    button {
        padding: 10px 20px;
        margin: 5px;
        font-size: 18px;
    }
</style>

<body>

    <h1>ストップウォッチ</h1>

    <h2 id="time">0</h2>

    <button onclick="start()">スタート</button>
    <button onclick="stop()">ストップ</button>
    <button onclick="reset()">リセット</button>

    <script>

        let count = 0;
        let timer;

        function start() {

            timer = setInterval(function () {

                count++;

                document.getElementById("time").textContent = count;

            }, 1000);

        }

        function stop() {

            clearInterval(timer);

        }

        function reset() {

            clearInterval(timer);

            count = 0;

            document.getElementById("time").textContent = count;

        }

    </script>

</body>

</html>
