<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>家計簿アプリ</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>💰 家計簿アプリ</h1>

    <input
        type="text"
        id="item"
        placeholder="内容を入力"
    >

    <select id="type">
    <option value="expense">支出</option>
    <option value="income">収入</option>
</select>

    <input
        type="number"
        id="amount"
        placeholder="金額を入力"
    >

    <button onclick="addExpense()">
        追加
    </button>

    <ul id="list"></ul>

    <h3 id="incomeTotal">
収入合計: ¥0
</h3>

<h3 id="expenseTotal">
支出合計: ¥0
</h3>

    <h2 id="total">合計: ¥0</h2>

    <script src="js/script.js"></script>

</body>
</html>
