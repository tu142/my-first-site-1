<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <title>カレンダー</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <h1>カレンダーアプリ</h1>

    <h2 id="today"></h2>

    <div class="month-nav">

        <button onclick="prevMonth()">←</button>

        <span id="month"></span>

        <button onclick="nextMonth()">→</button>

        <button onclick="goToday()">今日</button>

    </div>

    <table id="calendar">
    </table>

   <div id="schedule">
   <input
    type="text"
    id="searchText"
    placeholder="予定を検索"
    oninput="showDate()"
> 
   <h2 id="scheduleTitle">予定一覧</h2>
    <ul id="scheduleList"></ul>
</div>

    <script>
        let schedules =
            JSON.parse(localStorage.getItem("schedules")) || {};

        let currentDate = new Date();

        function showMessage(day) {


    const key =
        currentDate.getFullYear() + "-" +
        (currentDate.getMonth() + 1) + "-" +
        day;

 const currentText =
    schedules[key] ? schedules[key].text : "";

const schedule = prompt(
    "予定を入力してください",
    currentText
);
const category = prompt(
    "種類を入力してください\n病院 / 勉強 / 仕事 / その他"
);

if (schedules[key] && schedules[key].text) {
    message =
        "現在の予定: " +
        schedules[key].text +
        "\n\n新しい予定を入力してください";
}
if (schedule === "") {

    delete schedules[key];

} else if (schedule !== null) {


    schedules[key]= {
        text: schedule,
        category: category
    };

    localStorage.setItem(
        "schedules",
        JSON.stringify(schedules)
    );

    showDate();
}



        localStorage.setItem(
            "schedules",
            JSON.stringify(schedules)
        );

        showDate();
    }

        function showDate() {

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth() + 1;
            const firstDay = new Date(year, month - 1, 1).getDay();
            const lastDay = new Date(year, month, 0).getDate();
            document.getElementById("month").textContent =
                year + "年 " + month + "月";
            const lastWeekDay = (firstDay + lastDay - 1) % 7;
            const calendar = document.getElementById("calendar");
            const today = new Date();
            const todayDate = today.getDate();

            let html =
                "<tr>" +
                "<th style='color:red'>日</th>" +
                "<th>月</th>" +
                "<th>火</th>" +
                "<th>水</th>" +
                "<th>木</th>" +
                "<th>金</th>" +
                "<th style='color:blue'>土</th>" +
                "</tr>";
            html += "<tr>";
    
            for (let i = 0; i < firstDay; i++) {
                html += "<td></td>";

            }

            for (let day = 1; day <= lastDay; day++) {
                let text = day;
            
const key =
    year + "-" +
    month + "-" +
    day;
            
let bgColor = "";

if (schedules[key]) {

   if (schedules[key].category === "病院") {
        bgColor = "#ffb3b3";
  }
    else if (schedules[key].category === "勉強") {
        bgColor = "#b3d9ff";
    }
    else if (schedules[key].category === "仕事") {
        bgColor = "#b3ffb3";
    }
    else {
        bgColor = "#fff799";
    }
}

if (schedules[key]) {
    bgColor = "background-color: yellow;";
}


if (schedules[key]) {

    let icon = "📌";

    if (schedules[key].category === "病院") {
        icon = "🏥";
    } else if (schedules[key].category === "勉強") {
        icon = "📚";
    } else if (schedules[key].category === "仕事") {
        icon = "💼";
    }

    text =
        day +
        icon +
        "<br><small>" +
        schedules[key].text +
        "</small>";
}


               
                if (
                    day === new Date().getDate() &&
                    month === new Date().getMonth() + 1 &&
                    year === new Date().getFullYear()
                ) {
                       html += "<td class='today' style='background-color: lightgreen;' onclick='showMessage(" + day + ")'>" + text + "</td>";
                
                } else {
                    const dayOfWeek = (firstDay + day - 1) % 7;

                    if (dayOfWeek === 0) {
                      
                      html += "<td style='" + bgColor + " color:red'; onclick='showMessage(" + day + ")'>" + text + "</td>";
                    }
                    else if (dayOfWeek === 6) {
                        html += "<td style='" + bgColor + " color:blue'; onclick='showMessage(" + day + ")'>" + text + "</td>";
                    }
                    else {
                       html += "<td style='" + bgColor + " color:blue'; onclick='showMessage(" + day + ")'>" + text + "</td>";
                    }

                }

                if ((firstDay + day) % 7 === 0) {
                    html += "</tr><tr>";
                }
            }
            for (let i = lastWeekDay + 1; i < 7; i++) {
                html += "<td></td>";
            }

            html += "</tr>";

            calendar.innerHTML = html;

            const scheduleList =
    document.getElementById("scheduleList");

let listHtml = "";

const keys = Object.keys(schedules);

const searchText =
    document.getElementById("searchText").value;

keys.sort();

document.getElementById("scheduleTitle").textContent =
    "予定一覧（" + keys.length + "件）";

for (let key of keys) {

    if (
    searchText &&
    !schedules[key].text.includes(searchText)
) {
    continue;
}
listHtml +=
    "<li>" +
    key +
    " : " +
    schedules[key].text+
    " <button onclick=\"deleteSchedule('" + key + "')\">削除</button>" +
    "</li>";
    }
scheduleList.innerHTML = listHtml;

        }

        function prevMonth() {

            currentDate.setMonth(currentDate.getMonth() - 1);

            showDate();

        }

        function nextMonth() {

            currentDate.setMonth(currentDate.getMonth() + 1);

            showDate();
        }

        function goToday() {

            currentDate = new Date();
            showDate();

        }

        showDate();

function deleteSchedule(key) {

    if (!confirm("本当に削除しますか？")) {
        return;
    }

    delete schedules[key];

    localStorage.setItem(
        "schedules",
        JSON.stringify(schedules)
    );

    showDate();
}

    </script>
</body>

</html>
