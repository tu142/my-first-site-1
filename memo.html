<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>メモアプリ</title>
</head>

<body>

<h1>📝 メモアプリ</h1>

<input
    type="text"
    id="memoInput"
    placeholder="メモを入力"
    onkeypress="if(event.key==='Enter') addMemo()"
>

<input type="date" id="deadline">

<select id="priority">
    <option value="高">高</option>
    <option value="中" selected>中</option>
    <option value="低">低</option>
</select>

<button onclick="addMemo()">
追加
</button>


<button onclick="showCompleted()">
完了のみ表示
</button>


<button onclick="renderMemos()">
すべて表示
</button>


<button onclick="deleteCompleted()">
完了を削除
</button>


<br><br>

<input
    type="text"
    id="search"
    placeholder="検索"
    onkeyup="searchMemo()"
>


<p id="count">
残り 0 件
</p>


<ul id="memoList"></ul>


<script src="js/memo.js"></script>

<script src="script.js"></script>

</body>
</html>
