<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>メモアプリ</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>📝 メモアプリ</h1>

<input
    type="text"
    id="memoInput"
    placeholder="メモを入力"
    onkeypress="if(event.key==='Enter') addMemo()"
>

<input type="date" id="deadline">

<select id="priority">
    <option value="高">高</option>
    <option value="中" selected>中</option>
    <option value="低">低</option>
</select>

<select id="category">
    <option value="勉強">勉強</option>
    <option value="仕事">仕事</option>
    <option value="買い物">買い物</option>
    <option value="その他">その他</option>
</select>

<select id="categoryFilter" onchange="renderMemos()">
    <option value="すべて">すべて</option>
    <option value="仕事">仕事</option>
    <option value="勉強">勉強</option>
    <option value="買い物">買い物</option>
    <option value="その他">その他</option>
</select>

<select id="priorityFilter" onchange="renderMemos()">
    <option value="すべて">すべての優先度</option>
    <option value="高">高</option>
    <option value="中">中</option>
    <option value="低">低</option>
</select>

<select id="deadlineFilter" onchange="renderMemos()">
    <option value="すべて">すべての締切</option>
    <option value="今日">今日</option>
    <option value="期限切れ">期限切れ</option>
    <option value="締切あり">締切あり</option>
    <option value="締切なし">締切なし</option>
</select>

<button onclick="addMemo()">
追加
</button>


<button onclick="showCompleted()">
完了のみ表示
</button>


<button onclick="renderMemos()">
すべて表示
</button>


<button onclick="deleteCompleted()">
完了を削除
</button>

<button onclick="toggleDarkMode()">
    🌙 ダークモード
</button>
<br><br>

<input
    type="text"
    id="search"
    placeholder="検索"
    onkeyup="searchMemo()"
>


<p id="count">
残り 0 件
</p>


<ul id="memoList"></ul>


<script src="js/memo.js"></script>


</body>
</html>
