<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>じゃんけんゲーム</title>
</head>
<body>

    <h1>じゃんけんゲーム</h1>

    <button onclick="janken('グー')">グー</button>
    <button onclick="janken('チョキ')">チョキ</button>
    <button onclick="janken('パー')">パー</button>

    <h2 id="result"></h2>

    <script>
        function janken(player) {

            const hands = ["グー", "チョキ", "パー"];
            const computer = hands[Math.floor(Math.random() * 3)];

            let result = "";

            if (player === computer) {
                result = "あいこ！";
            } else if (
                (player === "グー" && computer === "チョキ") ||
                (player === "チョキ" && computer === "パー") ||
                (player === "パー" && computer === "グー")
            ) {
                result = "あなたの勝ち！";
            } else {
                result = "あなたの負け！";
            }

            document.getElementById("result").innerHTML =
                "相手：" + computer + "<br>" + result;
        }
    </script>

</body>
</html>
